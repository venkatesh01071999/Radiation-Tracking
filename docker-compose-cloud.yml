version: '1.0'

services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  init-kafka:
    image: apache/kafka:latest
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      cd /opt/kafka/bin
      ./kafka-topics.sh --create --topic radiation-topic -bootstrap-server kafka:9092 -partitions 1 --replication-factor 1
      "

  kafka-consumer:
    image: apache/kafka:latest
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      cd /opt/kafka/bin
      ./kafka-console-consumer.sh --from-beginning --bootstrap-server localhost:9092 --topic radiation-topic
      "


  producer:
    image: bdacr2025.azurecr.io/producer:v1 # pushed image to ACR
    container_name: producer
    depends_on:
      - init-kafka
    environment:
      KAFKA_CLIENT: kafka:9092
      CSV_FILE: /app/kafka/Data/measurements-out.csv
      CHUNK_FILE: /app/kafka/Data/partition-1.csv
      PROCESSED_FILE: /app/kafka/Data/processed.csv
      KAFKA_TOPIC: radiation-topic
      MESSAGE_DELAY: 0.5
      FLUSH_INTERVAL: 10
      SUBMISSION_INTERVAL: 0.5