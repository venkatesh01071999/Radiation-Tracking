apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: jobmanager
  name: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jobmanager
  template:
    metadata:
      labels:
        io.kompose.service: jobmanager
    spec:
      containers:
        - args:
            - jobmanager
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: jobmanager
          image: bdacr2025.azurecr.io/flink:v2
          name: flink-jobmanager
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 6123
              protocol: TCP
            - containerPort: 6124
              protocol: TCP
      resources:
        requests:
          memory: "1.5Gi"
          cpu: "0.5"
        limits:
          memory: "2Gi"
          cpu: "1"
      restartPolicy: Always