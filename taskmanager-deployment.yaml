apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: taskmanager
  name: taskmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: taskmanager
  template:
    metadata:
      labels:
        io.kompose.service: taskmanager
    spec:
      containers:
        - args:
            - taskmanager
            - -Dtaskmanager.numberOfTaskSlots=6
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: jobmanager
            - name: TASKMANAGER_NUMBER_OF_TASK_SLOTS
              value: "6"
          image: bdacr2025.azurecr.io/flink:v2
          name: flink-taskmanager
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "2Gi"
          cpu: "2"
      restartPolicy: Always
