version: '1.0'

services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    container_name: kafka
    networks:
      - common-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  init-kafka:
    image: apache/kafka:latest
    networks:
      - common-network
    depends_on:
      - kafka
    entrypoint: |
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        sleep 10
        echo 'Creating topics...'
        /opt/kafka/bin/kafka-topics.sh --create --topic radiation-topic --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --topic configuration-topic --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --topic processed-topic --bootstrap-server kafka:9092 --partitions 64 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --topic aggregate-topic --bootstrap-server kafka:9092 --partitions 64 --replication-factor 1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics --entity-name configuration-topic --add-config max.message.bytes=10485880
        echo 'Topics created successfully'
      "

  middleware:
    container_name: middleware
    image: venky01071999/middleware:latest
    ports:
      - "8000:8000"
    networks:
      - common-network
    depends_on:
      - init-kafka
    environment:
      KAFKA_CLIENT: kafka:9092
      PROCESSED_TOPIC: processed-topic
      AGGREGATE_TOPIC: aggregate-topic
      CONFIG_TOPIC: configuration-topic
  ui:
    container_name: ui
    image: venky01071999/ui:latest
    ports:
      - "3000:3000"
    networks:
      - common-network
    depends_on:
      - middleware
    environment:
      REACT_APP_SOCKET_URL: ws://localhost:8000
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_OSM_URL: https://nominatim.openstreetmap.org

  jobmanager:
    container_name: flink-jobmanager
    image: venky01071999/flink-jobmanager:latest
    networks:
      - common-network
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager

  taskmanager:
    container_name: flink-taskmanager
    image: venky01071999/flink-taskmanager:latest
    networks:
      - common-network
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      TASKMANAGER_NUMBER_OF_TASK_SLOTS: "140" #  greater than partition count
    command: taskmanager -Dtaskmanager.numberOfTaskSlots=140


  submit_job:
    container_name: flink-submit-job
    image: venky01071999/flink-submit-job:latest
    networks:
      - common-network
    depends_on:
      - jobmanager
      - taskmanager
      - init-kafka
    environment:
      KAFKA_CLIENT: kafka:9092
      KAFKA_TOPIC: radiation-topic
      CONFIG_TOPIC: configuration-topic
      PROCESSED_TOPIC: processed-topic
      AGGREGATE_TOPIC: aggregate-topic
      CONFIG_FILE: /opt/flink_app/Data/config.json
      FLINK_PROPERTIES: "jobmanager.rpc.address: jobmanager"
    entrypoint: |
      bash -c "
        sleep 15
        flink run -d -py kafka_consumer.py --jobmanager jobmanager:8081
      "

  producer:
    container_name: producer
    image: venky01071999/producer:latest
    networks:
      - common-network
    depends_on:
      - submit_job
    environment:
      KAFKA_CLIENT: kafka:9092
      CSV_FILE: /app/kafka/Data/measurements-out.csv
      CHUNK_FILE: /app/kafka/Data/partition-1.csv
      PROCESSED_FILE: /app/kafka/Data/processed.csv
      KAFKA_TOPIC: radiation-topic
      MESSAGE_DELAY: 0.5
      FLUSH_INTERVAL: 10
      SUBMISSION_INTERVAL: 0.5

networks:
  common-network:
    driver: bridge